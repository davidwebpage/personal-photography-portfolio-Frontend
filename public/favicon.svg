<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#0a0a0a"/>
  <!-- D 字标：左竖 + 右半圆碗，金色铺底。碗部内嵌一枚相机镜头——
       暗色镜片 + 金色镜筒边 + 一点反光高光。既是站名首字母「D」，
       又带相机/摄影的意象；整体轮廓是字母，不会退化成单纯的光圈圆环。 -->
  <path fill="#c9a558" d="M15 13 H27 A19 19 0 0 1 27 51 H15 Z"/>
  <circle cx="36" cy="32" r="7.5" fill="#0a0a0a"/>
  <circle cx="36" cy="32" r="7.5" fill="none" stroke="#c9a558" stroke-width="2"/>
  <circle cx="33" cy="29" r="1.6" fill="#c9a558"/>
</svg>
